name: failscope-ai

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-failscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-failscope}
      POSTGRES_DB: ${DB_NAME:-failscope}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-failscope}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    # Loads real local secrets (OpenAI key, Google OAuth client id/secret, etc.)
    # from backend/.env. Without this, the ${VAR:-} defaults below would silently
    # resolve to empty strings (docker compose substitutes those from the host
    # shell env, not from backend/.env), breaking Google sign-in and AI calls.
    env_file: ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-failscope}:${DB_PASSWORD:-failscope}@db:5432/${DB_NAME:-failscope}
      REDIS_URL: redis://redis:6379/0
      # This compose file serves the frontend container on 8081 (see the
      # frontend service below) - not the 5180 used by the native `npm run dev`
      # workflow in CLAUDE.md Section 7 - so CORS and OAuth redirects must point
      # at 8081 here, overriding whatever backend/.env has for native dev.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8081","http://localhost:5180"]}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8010/auth/google/callback}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8010:8000"
    volumes:
      - artifact_storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-failscope}:${DB_PASSWORD:-failscope}@db:5432/${DB_NAME:-failscope}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifact_storage:/app/storage

  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  artifact_storage:
