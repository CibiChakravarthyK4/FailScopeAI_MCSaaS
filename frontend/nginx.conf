server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Exact match takes precedence over the /auth prefix proxy below: this is
    # the frontend's own React Router page (App.tsx) that the Google OAuth
    # redirect lands on (app/routers/auth.py builds the redirect as
    # {FRONTEND_URL}/auth/callback?access_token=...), not a backend API route -
    # it must be served as the SPA, not proxied to the backend (which has no
    # matching route and would 404/502 the whole sign-in flow).
    location = /auth/callback {
        try_files /index.html =404;
    }

    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
