name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment for this run - set to production to run the launch-blocker check below"
        required: true
        default: development
        type: choice
        options: [development, production]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      # Ports (5433/6380) and the "failscope" maintenance db name match local dev
      # (see CLAUDE.md "Local development") on purpose: tests/conftest.py hardcodes
      # these same values, so CI runs the exact same test suite with no special-casing.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: failscope
          POSTGRES_PASSWORD: failscope
          POSTGRES_DB: failscope
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U failscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Lint
        run: |
          cd backend
          ruff check app
      - name: Type check
        run: |
          cd backend
          mypy app --ignore-missing-imports
      - name: Dependency audit
        run: |
          cd backend
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test (includes Alembic migration up/down check)
        run: |
          cd backend
          pytest --cov=app --cov-fail-under=80

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint and type-check
        run: |
          cd frontend
          npm run lint
          npm run type-check
      - name: Test
        run: |
          cd frontend
          npm test -- --run
      - name: Dependency audit
        run: |
          cd frontend
          npm audit --audit-level=high
      - name: UI design compliance (docs/design-system.md, docs/testing.md)
        run: |
          cd frontend/src
          ! grep -rE "(linear|radial|conic)-gradient" . --include="*.tsx" --include="*.ts" --include="*.css"
          ! grep -rEn '\b(red|green|amber|yellow|orange|purple)-[0-9]+\b' . --include="*.tsx" --include="*.ts"
      - name: Branding check - no old product name (docs/testing.md)
        run: |
          cd frontend/src
          # theme/tokens.css is the one allowed exception: a comment explaining
          # why the token prefix changed, not user-facing text.
          ! grep -rn "FailScope\|ScopeRing\|Scope Ring" . --include="*.tsx" --include="*.ts" | grep -v "theme/tokens.css"
          ! grep -rn --include="*.tsx" --include="*.ts" --include="*.css" -- "--fs-" . | grep -v "theme/tokens.css"

  launch-blocker-check:
    # Only runs when someone deliberately triggers this workflow with
    # environment=production (Actions tab -> "Run workflow") - never on an
    # ordinary push/PR, since frontend/src/config/company.ts's placeholders
    # are expected to still be unfilled during normal development and would
    # otherwise fail every single CI run until launch.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build for production
        env:
          APP_ENV: production
        run: |
          cd frontend
          npm run build
      - name: Launch blocker - no unfilled company.ts placeholder may reach a production build
        run: |
          cd frontend
          # Exact known placeholder strings from src/config/company.ts, not a
          # generic [bracket] pattern - a generic pattern false-positives on
          # minified regex character classes, [object Object]/[object
          # FormData], and markdown link text like "[Security and Trust]"
          # from Help Center articles, which would never clear even once
          # every real placeholder is filled in.
          ! grep -rF \
            -e '[Company legal name]' \
            -e '[support email]' \
            -e '[sales email]' \
            -e '[hiring email]' \
            -e '[security email]' \
            -e '[phone number]' \
            -e '[registered address]' \
            -e '[working hours]' \
            -e '[Grievance Officer name]' \
            -e '[grievance officer email]' \
            -e '[grievance officer address]' \
            -e '[city]' \
            -e '[effective date]' \
            dist/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  e2e-test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start the Docker Compose stack (with the AI stub overlay)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for the backend and frontend to be reachable
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8010/health > /dev/null && curl -sf http://localhost:8081/ > /dev/null; then
              echo "Stack is up"
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready in time"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs
          exit 1
      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: |
          cd e2e
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/test-results/
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
